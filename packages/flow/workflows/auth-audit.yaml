# auth-audit: scan → fanout audit → re-verify → report.
# Agents are defined in their .md files (project .pi/agents overrides global
# getAgentDir()/agents); this workflow only NAMES them. Phase schemas live on
# the phases (a phase contract, not an agent property).
name: auth-audit
description: Audit auth coverage across route files
input: prompt
agents: [scanner, auditor, synth]
phases:
  - id: scan
    agent: scanner
    prompt: "List every route file under src/routes/. Return a newline list."
    out: files
  - id: audit
    agent: auditor
    fanout: files
    schema:
      verdict: "APPROVED|REVISE"
    prompt: "Audit {{item}} for missing auth checks. Return findings."
    out: findings
  - id: verify
    agent: auditor
    schema:
      verdict: "APPROVED|REVISE"
    verify: findings
    threshold: 0.66
    out: confirmed
  - id: report
    agent: synth
    prompt: "Write a cited scan report from these findings into scan-report.md under the plan dir."
    inputs:
      require: [confirmed]
      inject: ["Findings: {{confirmed}}", "Write the report to ai_plan/{{slug}}/scan-report.md"]
    outputs:
      slug: { from: input, prefix: date }
      dir: "ai_plan/{{slug}}"
      artifacts:
        - { file: scan-report.md }
      assert: [nonempty]
      publish: { slug: "{{slug}}", report_dir: "{{dir}}" }
loops:
  audit:
    until_dry: true
    max_rounds: 3
    dedup_key: "{{file}}:{{line}}:{{summary}}"
