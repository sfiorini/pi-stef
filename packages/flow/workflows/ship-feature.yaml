# ship-feature: clarify → design → plan → plan-review loop → implement → impl-review loop → audit loop.
# Fully decomposed tier-2 flow: every phase is an agent (no skill phases).
# Groups make each review/audit a find→fix→re-verify loop.
# args.flow + args.slug are passed to every phase by sf_flow_auto.
name: ship-feature
description: Clarify, design, plan, implement, and audit a feature end-to-end
input: prompt
agents:
  elicitor:
    tools: [read, grep, find, ls]
    thinking: high
    isolated: true
    schema:
      questions: array
  designer:
    tools: [read, grep, find, ls]
    thinking: high
    isolated: true
  planner:
    tools: [read, grep, find, ls]
    thinking: medium
    isolated: true
  developer:
    tools: [read, grep, find, ls, write, bash]
    thinking: medium
  reviewer:
    tools: [read, grep, find, ls]
    thinking: high
    isolated: true
    schema:
      verdict: APPROVED|REVISE
      findings: array
  auditor:
    tools: [read, grep, find, ls]
    thinking: high
    isolated: true
    schema:
      verdict: APPROVED|REVISE
      findings: array
  notifier:
    tools: [bash]
    thinking: low
    isolated: true
    schema:
      status: sent|skipped|failed
      detail: string?
groups:
  plan-review:
    phases: [review-plan, fix-plan]
  impl-review:
    phases: [review-impl, fix-impl]
  audit-loop:
    phases: [review-audit, fix-audit]
phases:
  - id: clarify
    questions: elicitor
    prompt: "Given this feature request, identify what is unclear about scope, constraints, success criteria, and edge cases. Return a questions array — empty if the task is clear enough to design."
    max_rounds: 5
    out: requirements
  - id: design
    agent: designer
    in: requirements
    out: design_doc
    prompt: "Given the requirements, produce a design. Auto-finalize: skip the STATUS relay, pick the recommended approach, return the design directly."
  - id: plan
    agent: planner
    in: design_doc
    out: plan_doc
    prompt: "Given the design, produce an exhaustive milestone plan with bite-sized stories (S-MN{seq})."
  - id: review-plan
    agent: reviewer
    in: plan_doc
    prompt: "Review the plan for completeness, correctness, and risk. Return findings P0-P3 + verdict."
  - id: fix-plan
    agent: planner
    in: plan_doc
    prompt: "Address the reviewer findings. Minimal changes, no regressions. Report per-finding."
  - id: implement
    agent: developer
    in: plan_doc
    out: impl_result
    prompt: "Implement the plan using TDD (red/green/refactor). Run tests + typecheck. Commit locally."
  - id: review-impl
    agent: reviewer
    in: impl_result
    prompt: "Review the implementation diff against the plan. Return findings P0-P3 + verdict."
  - id: fix-impl
    agent: developer
    in: impl_result
    prompt: "Fix the reviewer findings. TDD: test first. Minimal diff, no regressions. Report per-finding."
  - id: review-audit
    agent: auditor
    in: impl_result
    prompt: "Audit the implementation for correctness, security, performance, and clarity. Return findings P0-P3 + verdict."
  - id: fix-audit
    agent: developer
    in: impl_result
    prompt: "Fix the audit findings. TDD: test first. Minimal diff, no regressions. Report per-finding."
  - id: notify
    agent: notifier
    prompt: "ship-feature complete"
    out: notify_result
loops:
  plan-review:
    until: approved
    fail_on: [P0, P1, P2]
    max_rounds: 10
  impl-review:
    until: approved
    fail_on: [P0, P1, P2]
    max_rounds: 5
  audit-loop:
    until: approved
    fail_on: [P0, P1, P2]
    max_rounds: 5
