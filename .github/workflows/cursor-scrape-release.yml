name: Cursor scrape + auto-release

# Manual trigger (workflow_dispatch) is always enabled. The weekly schedule runs
# every Monday 06:00 UTC; it was enabled after a clean workflow_dispatch run
# confirmed the plumbing (scrape → diff → test → release → publish) end-to-end.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC

# A PAT is REQUIRED (not the default GITHUB_TOKEN): pushes made with the default
# GITHUB_TOKEN do not trigger downstream workflows, so the tag push from release.mjs
# would NOT fire publish.yml. Provide a PAT with `repo` + `workflow` scopes as the
# repo secret CURSOR_RELEASE_TOKEN. (Workflow permissions must also be set to
# "Read and write" in the repo's Actions settings.)
permissions:
  contents: write

concurrency:
  group: cursor-scrape-release
  cancel-in-progress: false

jobs:
  scrape-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with PAT so tag push triggers publish.yml)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CURSOR_RELEASE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install chromium (revision matching playwright-core)
        run: cd packages/cursor && npx --yes "playwright@$(node -p "require('playwright-core/package.json').version")" install chromium

      - name: Scrape cursor.com/docs for context windows
        run: pnpm --filter @pi-stef/cursor exec tsx scripts/scrape-docs-contexts.ts

      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code -- packages/cursor/src/model-scraped-contexts.generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — scraped contexts match the committed file. Nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Scraped contexts changed — proceeding to test + release."
          fi

      - name: Commit scraped file, run tests, cut patch release, push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit the refreshed scraped file FIRST so release.mjs sees a clean tree
          # (its assertCleanWorkingDir gate would otherwise abort).
          git add packages/cursor/src/model-scraped-contexts.generated.ts
          git commit -m "chore(cursor): refresh scraped context windows"
          # release.mjs runs the full `pnpm test` suite (gate), bumps the cursor
          # patch version, updates CHANGELOG.md, commits `release(cursor): vX.Y.Z`,
          # tags `@pi-stef/cursor@X.Y.Z`, and pushes. The tag push (via the PAT)
          # triggers .github/workflows/publish.yml → npm publish.
          node scripts/release.mjs --pkg cursor --bump patch --yes --no-sync-check
